[project]
name = "iesmmg-api"
version = "0.1.0"
description = "Simulation-only IESMMG foundation API"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "httpx==0.28.1",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iesmmg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "scripts"]
